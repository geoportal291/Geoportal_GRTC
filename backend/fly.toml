# fly.toml app configuration file generated for geoportal-backend-setiembre--cied on 2026-09-07T09:46:22-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geoportal-backend-setiembre--cied'
primary_region = 'gru'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Mínimo 1 máquina SIEMPRE encendida: con 0, la app se apagaba por inactividad y el
  # siguiente request topaba con un arranque en frío de 10-15 s durante el cual el proxy
  # responde 502 sin cabeceras CORS (el frontend lo ve como "CORS error / ERR_FAILED").
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096


