app = "db-geoportal"
primary_region = "scl"

[build]
  dockerfile = "Dockerfile"

[env]
  PGDATA = "/var/lib/postgresql/data/db"

[mounts]
  source = "pg_data"
  destination = "/var/lib/postgresql/data"

[[services]]
  internal_port = 5432
  protocol = "tcp"

  [[services.ports]]
    port = 5432

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
