app = 'geoportal-frontend-u3zi'
primary_region = 'gru'

[build]
  [build.args]
    REACT_APP_API_BASE = "https://geoportal-backend-u3zi.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
