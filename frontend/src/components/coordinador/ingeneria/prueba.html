<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Flotante GIS - Alineación Corregida</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. BARRA VERTICAL --- */
        .toolbar-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* Separación entre bloques */
        }

        .tool-group {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Bordes redondeados */
        }

        .tool-btn {
            width: 42px;
            height: 42px;
            background: white;
            border: none;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            color: #666;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tool-btn:last-child {
            border-bottom: none;
        }

        .tool-btn:hover {
            background-color: #f9f9f9;
            color: #333;
        }

        /* Estado Activo: Se pone azul cuando su menú está abierto */
        .tool-btn.active {
            background-color: #eef6ff;
            color: #0056b3;
            border-left: 3px solid #0056b3;
            /* Borde azul a la izquierda */
            padding-right: 3px;
            /* Compensar el borde para centrar icono */
        }


        /* --- 2. TARJETAS FLOTANTES (CORREGIDO) --- */
        .flyout-card {
            /* IMPORTANTE: Fixed para que ignore cualquier contenedor padre y use coordenadas de pantalla */
            position: fixed;
            width: 280px;
            background: white;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid #e0e0e0;
            display: none;
            z-index: 2000;
            /* Siempre encima de todo */
            animation: fadeIn 0.2s ease-out;
        }

        /* La flechita que apunta al botón */
        .flyout-card::before {
            content: "";
            position: absolute;
            top: 16px;
            /* Ajustado para que apunte al centro del botón */
            left: -8px;
            width: 14px;
            height: 14px;
            background: inherit;
            /* Hereda el color del header o body */
            transform: rotate(45deg);
            border-left: 1px solid rgba(0, 0, 0, 0.1);
            /* Sombra sutil borde */
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            z-index: -1;
            /* Detrás del contenido */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Headers de Colores */
        .card-header {
            padding: 12px 15px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Color específico para la flecha según el header */
        /* Azul */
        .header-blue {
            background-color: #004080;
        }

        .card-blue::before {
            background-color: #004080;
        }

        /* Naranja */
        .header-orange {
            background-color: #e67e22;
        }

        .card-orange::before {
            background-color: #e67e22;
        }

        /* Morado */
        .header-purple {
            background-color: #6c5ce7;
        }

        .card-purple::before {
            background-color: #6c5ce7;
        }

        .card-body {
            padding: 15px;
            font-size: 14px;
        }

        /* Elementos UI dentro del menú */
        .ui-row {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-block {
            width: 100%;
            padding: 8px;
            background: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
            color: #444;
        }

        .btn-block:hover {
            background: #e2e2e2;
        }

        .input-flex {
            display: flex;
            gap: 0;
        }

        .input-flex input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-right: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .input-flex button {
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="toolbar-container">
        <div class="tool-group">
            <button class="tool-btn"><i class="fas fa-plus"></i></button>
            <button class="tool-btn"><i class="fas fa-minus"></i></button>
        </div>

        <div class="tool-group">
            <button class="tool-btn" onclick="toggleMenu('menu-medir', this)">
                <i class="fas fa-ruler-combined"></i>
            </button>
            <button class="tool-btn" onclick="toggleMenu('menu-dibujo', this)">
                <i class="fas fa-pencil-alt" style="color: #e67e22;"></i>
            </button>
            <button class="tool-btn" onclick="toggleMenu('menu-kml', this)">
                <i class="fas fa-save" style="color: #6c5ce7;"></i>
            </button>
            <button class="tool-btn" onclick="toggleMenu('menu-capas', this)">
                <i class="fas fa-layer-group" style="color: #004080;"></i>
            </button>
        </div>

        <div class="tool-group">
            <button class="tool-btn"><i class="fas fa-trash-alt"></i></button>
        </div>
    </div>


    <div id="menu-medir" class="flyout-card card-blue">
        <div class="card-header header-blue">
            <span>Mediciones</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="closeAll()"></i>
        </div>
        <div class="card-body">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn-block"><i class="fas fa-ruler"></i> Distancia</button>
                <button class="btn-block"><i class="fas fa-draw-polygon"></i> Área</button>
            </div>
            <label style="font-size:12px; font-weight:bold; color:#666;">Ubicar Progresiva:</label>
            <div class="input-flex">
                <input type="text" placeholder="Km 4+780">
                <button>Ir</button>
            </div>
        </div>
    </div>

    <div id="menu-dibujo" class="flyout-card card-orange">
        <div class="card-header header-orange">
            <span>Herramientas de Dibujo</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="closeAll()"></i>
        </div>
        <div class="card-body">
            <label class="ui-row"><input type="checkbox"> Habilitar edición</label>
            <label class="ui-row"><input type="color" value="#ff4500"> Color de línea</label>
            <button class="btn-block" style="background:#fff0e6; color:#d35400; border-color:#fadbd8;">Borrar último
                punto</button>
        </div>
    </div>

    <div id="menu-kml" class="flyout-card card-purple">
        <div class="card-header header-purple">
            <span>Gestión de Archivos</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="closeAll()"></i>
        </div>
        <div class="card-body">
            <button class="btn-block"><i class="fas fa-upload"></i> Cargar KML</button>
            <button class="btn-block"><i class="fas fa-download"></i> Guardar Proyecto</button>
        </div>
    </div>

    <div id="menu-capas" class="flyout-card card-blue">
        <div class="card-header header-blue">
            <span>Información General</span>
            <i class="fas fa-times" style="cursor:pointer" onclick="closeAll()"></i>
        </div>
        <div class="card-body">
            <label class="ui-row"><input type="radio" name="map" checked> Estándar</label>
            <label class="ui-row"><input type="radio" name="map"> Topográfico</label>
            <label class="ui-row"><input type="radio" name="map"> Satélite</label>
        </div>
    </div>

    <script>
        function toggleMenu(menuId, btnElement) {
            const menu = document.getElementById(menuId);
            const isVisible = menu.style.display === 'block';

            // 1. Cerrar todo primero
            closeAll();

            // 2. Si no estaba visible, lo abrimos y calculamos posición
            if (!isVisible) {
                // Obtener coordenadas EXACTAS del botón en la pantalla
                const rect = btnElement.getBoundingClientRect();

                // Posicionar el menú:
                // LEFT: Borde derecho del botón + 15px de margen
                menu.style.left = (rect.right + 15) + 'px';

                // TOP: Alineado con la parte superior del botón
                menu.style.top = rect.top + 'px';

                // Mostrar
                menu.style.display = 'block';
                btnElement.classList.add('active');
            }
        }

        function closeAll() {
            document.querySelectorAll('.flyout-card').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        }

        // Opcional: Recalcular posición si se cambia el tamaño de ventana
        window.addEventListener('resize', closeAll);
    </script>
</body>

</html>
