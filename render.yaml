services:
  # Database (PostgreSQL)
  - type: pserv
    name: geoportal-db
    env: docker
    plan: free
    region: oregon

  # Backend (Node.js)
  - type: web
    name: geoportal-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoportal-db
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Frontend (Static Site)
  - type: site
    name: geoportal-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: build
    envVars:
      - key: REACT_APP_API_BASE
        fromService:
          type: web
          name: geoportal-backend
          property: url
